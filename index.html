<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quranic Variant Readings Viewer | Academic Corpus</title>
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #665c54;
      --border-color: #e2ddd5;
      --accent-color: #2c3e50;
      --hover-bg: #f4f0eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* استفاده از فونت‌های استاندارد، خوانا و امن سیستم بدون نیاز به اینترنت یا فونت خارجی */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Vazirmatn", "Tahoma", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .explorer-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 1.5rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.08);
    }

    .results-list {
      max-height: 550px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 4px;
    }

    .data-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-color);
      padding: 1.25rem;
      border-radius: 6px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .data-card:hover {
      background: var(--card-bg);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .card-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .card-content {
      font-size: 1.05rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .status-message {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-style: italic;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Quranic Variant Readings</h1>
      <p class="subtitle">Digital Explorer for <code style="background:#f4f0eb; padding:2px 6px; border-radius:4px;">readers.xml</code> dataset.</p>
    </header>

    <div class="explorer-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Type to search through the XML corpus...">
      
      <div id="resultsContainer" class="results-list">
        <div class="status-message">Loading dataset...</div>
      </div>
    </div>

    <footer>
      University of Groningen · Academic Research Portfolio
    </footer>
  </div>

  <script>
    (function() {
      const xmlPath = 'data/readers.xml';
      const container = document.getElementById('resultsContainer');
      const searchInput = document.getElementById('searchInput');
      
      let parsedData = [];

      fetch(xmlPath)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return response.text();
        })
        .then(xmlString => {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlString, "application/xml");
          
          const parseError = xmlDoc.querySelector("parsererror");
          if (parseError) throw new Error("XML Parsing Error");

          let nodes = xmlDoc.getElementsByTagName('*');
          parsedData = [];

          for (let i = 0; i < nodes.length; i++) {
            let text = nodes[i].textContent.trim();
            let tagName = nodes[i].nodeName;
            
            if (text.length > 0 && text.length < 800 && tagName !== 'parsererror' && tagName !== nodes[0].nodeName) {
              parsedData.push({
                tag: tagName,
                text: text
              });
            }
          }

          if (parsedData.length === 0) {
            container.innerHTML = `<div class="status-message">File loaded, but no valid entries found inside <code style="background:#f4f0eb; padding:2px 4px;">readers.xml</code>.</div>`;
            return;
          }

          renderResults(parsedData);

          searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
              renderResults(parsedData);
              return;
            }
            const filtered = parsedData.filter(item => 
              item.text.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query)
            );
            renderResults(filtered);
          });

        })
        .catch(err => {
          console.error(err);
          container.innerHTML = `
            <div class="status-message" style="color: #c0392b;">
              <strong>Error loading data:</strong> Could not read <code style="background:#fadbd8; padding:2px 4px;">data/readers.xml</code>.<br>
              Make sure the file exists in the <code style="background:#fadbd8; padding:2px 4px;">data</code> folder.<br><br>
              <a href="${xmlPath}" target="_blank" style="color: #2980b9; text-decoration: underline;">Test opening XML file directly</a>
            </div>`;
        });

      function renderResults(items) {
        if (items.length === 0) {
          container.innerHTML = '<div class="status-message">No matching records found.</div>';
          return;
        }

        let html = '';
        const limit = Math.min(items.length, 150);
        for (let i = 0; i < limit; i++) {
          html += `
            <div class="data-card">
              <div class="card-meta">Element: &lt;${items[i].tag}&gt;</div>
              <div class="card-content">${escapeHtml(items[i].text)}</div>
            </div>
          `;
        }
        container.innerHTML = html;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    })();
  </script>

</body>
</html>
